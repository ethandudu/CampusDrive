services:
  mariadb:
    image: mariadb:12
    container_name: campusdrive_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
        - campusdrive_network

  php:
    build: .
    container_name: campusdrive_php
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - uploads_data:/var/www/uploads
    depends_on:
      - mariadb
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mariadb}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CampusDrive}
      APP_BASE_URL: ${APP_BASE_URL:-https://campusdrive.fr}
      UNIVERSITY_EMAIL_DOMAINS: ${UNIVERSITY_EMAIL_DOMAINS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      BEHIND_CLOUDFLARE: ${BEHIND_CLOUDFLARE:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-45}
    restart: unless-stopped
    networks:
        - campusdrive_network
        - scanner_network

  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    volumes:
      - clamav_data:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --stream --no-summary /etc/hostname >/dev/null 2>&1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30m
    networks:
      - scanner_network

volumes:
  mariadb_data:
  uploads_data:
  clamav_data:

networks:
    campusdrive_network:
      driver: bridge
    scanner_network:
      driver: bridge
