services:
  mariadb:
    image: mariadb:12
    container_name: campusdrive_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: campusdrive
      MYSQL_USER: campususer
      MYSQL_PASSWORD: campuspassword
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
        - campusdrive_network

  php:
    build: .
    container_name: campusdrive_php
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - uploads_data:/var/www/uploads
    depends_on:
      - mariadb
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: campusdrive
      MYSQL_USER: campususer
      MYSQL_PASSWORD: campuspassword
      APP_BASE_URL: https://campusdrive.fr
    restart: unless-stopped
    networks:
        - campusdrive_network

volumes:
  mariadb_data:
  uploads_data:

networks:
    campusdrive_network:
      driver: bridge
