services:
  mariadb:
    image: mariadb:12
    container_name: campusdrive_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: campusdrive
      MYSQL_USER: campususer
      MYSQL_PASSWORD: campuspassword
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
        - campusdrive_network
    ports:
      - "3306:3306"

  php:
    build: .
    container_name: campusdrive_php
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - uploads_data:/var/www/uploads
    depends_on:
      - mariadb
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: campusdrive
      MYSQL_USER: campususer
      MYSQL_PASSWORD: campuspassword
      APP_BASE_URL: https://campusdrive.fr
    restart: unless-stopped
    networks:
        - campusdrive_network
        - scanner_network

  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    volumes:
      - clamav_data:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --stream --no-summary /etc/hostname >/dev/null 2>&1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30m
    networks:
      - scanner_network

volumes:
  mariadb_data:
  uploads_data:
  clamav_data:

networks:
    campusdrive_network:
      driver: bridge
    scanner_network:
      driver: bridge
