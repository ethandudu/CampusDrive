name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Lint PHP files
        run: |
          find app -name '*.php' -not -path 'app/vendor/*' -print0 \
            | xargs -0 -n1 php -l

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    needs: lint

    services:
      mariadb:
        image: mariadb:12
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: campusdrive_test
          MYSQL_USER: campususer
          MYSQL_PASSWORD: campuspassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: campusdrive_test
      DB_USER: campususer
      DB_PASSWORD: campuspassword

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, gd, zip
          coverage: none

      - name: Load database schema
        run: |
          mysql --host=127.0.0.1 --port=3306 -u campususer -pcampuspassword campusdrive_test < init.sql

      - name: Install Composer dependencies
        working-directory: app
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        working-directory: app
        run: vendor/bin/phpunit --display-deprecations
